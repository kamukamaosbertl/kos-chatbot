# Render.com blueprint: New + > Blueprint > pick this repo
services:
  - type: web
    name: kos-chatbot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: LLM_API_KEY
        sync: false          # you paste your key in the Render dashboard; never commit it
      - key: LLM_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai
      - key: LLM_MODEL
        value: gemini-2.5-flash
      - key: ALLOWED_ORIGINS
        value: https://kamukamaosbertl.github.io
